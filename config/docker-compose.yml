services:
  typesense:
    image: typesense/typesense:29.0
    restart: unless-stopped
    environment:
      TYPESENSE_API_KEY: ${TS_ADMIN_KEY}
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_ENABLE_CORS: "true"
    volumes:
      - ./data:/data
    ports:
      - "8108:8108"

  caddy:
    image: caddy:2
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy-data:/data
    ports:
      - "80:80"
      - "443:443"
